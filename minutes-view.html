<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 · 경제소학회</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body data-page="minutes" data-mode="view">

<header id="topbar"></header>
<div id="banner" hidden></div>

<main class="narrow">
  <div class="card post">
    <div class="post-head">
      <h1 id="title"></h1>
      <div class="menu">
        <button type="button" class="kebab" id="menu-btn" aria-label="더보기" aria-expanded="false">
          <svg width="4" height="16" viewBox="0 0 4 16" aria-hidden="true">
            <circle cx="2" cy="2.4" r="1.7"/><circle cx="2" cy="8" r="1.7"/><circle cx="2" cy="13.6" r="1.7"/>
          </svg>
        </button>
        <div class="menu-pop" id="menu-pop" hidden>
          <button type="button" id="edit">수정</button>
          <button type="button" id="del">삭제</button>
        </div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="body" id="body"></div>

    <div class="attach" id="attendees-wrap" hidden>
      <b>참석자</b>
      <div class="who-row" id="attendees"></div>
    </div>

    <div class="attach" id="file-wrap" hidden>
      <b>첨부파일</b><span id="file"></span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=9"></script>
<script src="common.js?v=9"></script>
<script src="store.js?v=9"></script>
<script src="minutes.js?v=9"></script>
</body>
</html>
