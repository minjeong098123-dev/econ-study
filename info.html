<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 공유 · 경제소학회</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="info" data-board="info" data-mode="list">

<header id="topbar"></header>
<div id="banner" hidden></div>

<main class="narrow">
  <h1 class="page">정보 공유</h1>

  <div class="toolbar">
    <input type="search" id="q" placeholder="검색어를 입력하세요">
    <button type="button" class="btn" id="search">검색</button>
    <button type="button" class="btn primary" id="write">작성하기</button>
  </div>

  <div class="card">
    <ul class="list" id="list"></ul>
  </div>

  <nav class="pager" id="pager"></nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="store.js"></script>
<script src="board.js"></script>
</body>
</html>
