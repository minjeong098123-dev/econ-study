<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 공유 작성 · 경제소학회</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- 작성 페이지에는 상단 메뉴를 넣지 않습니다 -->
<body data-board="info" data-mode="write">

<div id="banner" hidden></div>

<main class="narrow">
  <h1 class="page">정보 공유</h1>

  <div class="card">
    <div class="form">
      <div class="row">
        <label for="title">제목</label>
        <div class="field"><input type="text" id="title" placeholder="제목을 입력하세요"></div>
      </div>

      <div class="row">
        <label for="body">내용</label>
        <div class="field"><textarea id="body" placeholder="내용을 입력하세요"></textarea></div>
      </div>

      <div class="row">
        <label for="link">링크</label>
        <div class="field">
          <input type="url" id="link" placeholder="https:// 로 시작하는 주소 (없으면 비워 두세요)">
        </div>
      </div>

      <div class="row">
        <label>파일</label>
        <div class="field">
          <div class="file-box" id="file-box"></div>
          <button type="button" class="btn" id="upload">업로드</button>
        </div>
      </div>

      <div class="row">
        <span></span>
        <div class="btn-row">
          <button type="button" class="btn primary" id="submit">작성하기</button>
          <button type="button" class="btn" id="cancel">취소</button>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" hidden>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="store.js"></script>
<script src="board.js"></script>
</body>
</html>
